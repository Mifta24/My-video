  <ellipse cx="1280" cy="720" rx="1020" ry="510" stroke-width="2" transform="rotate(45 1280 720)"/>
  <ellipse cx="1280" cy="720" rx="1020" ry="510" stroke-width="2" transform="rotate(106 1280 720)"/>
</g>
<g fill="none" stroke="#314c5d" stroke-width="2" opacity=".9">
 <circle cx="805" cy="720" r="207"/>
 <circle cx="805" cy="720" r="234" stroke-dasharray="2 18" stroke-linecap="round"/>
</g>
<!-- Logo and lettering entirely within center mobile safe area x=507..2053, y=509..931. -->
<g transform="translate(585 500) scale(.43)">
 <circle cx="512" cy="512" r="350" fill="#F5ECD7" stroke="#C9A35B" stroke-width="7"/>
