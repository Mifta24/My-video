  <ellipse cx="512" cy="512" rx="155" ry="260" transform="rotate(120 512 512)"/>
 </g>
 <g fill="#C8553D" stroke="#F5ECD7" stroke-width="6">
  <circle cx="400" cy="323" r="30"/><circle cx="748" cy="448" r="30"/><circle cx="425" cy="696" r="30"/>
 </g>
 <circle cx="512" cy="512" r="68" fill="#F5A623" stroke="#F5ECD7" stroke-width="13"/>
 <circle cx="497" cy="493" r="14" fill="#FFD477" opacity=".85"/>
</g>
<path d="M1003 580v280" fill="none" stroke="#A98E5C" stroke-width="2"/>
<text x="1083" y="774" font-family="DejaVu Sans,Arial,sans-serif" font-size="150" font-weight="700" letter-spacing="12" fill="#F5ECD7">SUHUF</text>
