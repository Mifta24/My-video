<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440" role="img" aria-labelledby="title desc">
<title id="title">Suhuf — YouTube channel banner</title>
<desc id="desc">Banner YouTube navy dengan simbol atom krem dan wordmark SUHUF yang semuanya terletak dalam area aman perangkat mobile.</desc>
<rect width="2560" height="1440" fill="#0B1B2E"/>
